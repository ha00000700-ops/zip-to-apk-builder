name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: تثبيت الحزم
        run: npm install

      - name: بناء المشروع
        run: npm run build

      - name: رفع ملفات البناء
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
