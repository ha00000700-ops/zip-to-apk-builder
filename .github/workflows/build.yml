name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find ZIP
        id: find_zip
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d extracted

          echo "ZIP extracted successfully."
          find extracted -maxdepth 4 -type f | sort | head -200

      - name: Find Android Project
        id: android_project
        run: |
          SETTINGS=$(find extracted -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "::error::Android settings.gradle or settings.gradle.kts was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Gradle Wrapper
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ]; then
            echo "Gradle Wrapper found."
          else
            echo "Gradle Wrapper not found. Creating it..."
            gradle wrapper

            if [ ! -f "./gradlew" ]; then
              echo "::error::Failed to create Gradle Wrapper."
              exit 1
            fi
          fi

          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Debug APK
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Locate & Verify APK
        id: apk_path
        run: |
          APK_FILE=$(find extracted -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::No APK file was produced."
            echo "Searching for APK files..."
            find extracted -type f -name "*.apk" -print
            exit 1
          fi

          echo "Found real APK:"
          ls -lh "$APK_FILE"

          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.apk_path.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
