name: Build Al-Noor APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'al-noor-(النور).zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q 'al-noor-(النور).zip' -d extracted

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ لم يتم العثور على مشروع Android"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "✅ Android project: $PROJECT_DIR"

      - name: Create Gradle Wrapper
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi

          chmod +x gradlew

      - name: Create debug keystore
        run: |
          cd "$PROJECT_DIR"

          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "✅ debug.keystore created"

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleRelease --stacktrace

      - name: Find APK
        run: |
          echo "📦 APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Noor-Release-APK
          path: |
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error
