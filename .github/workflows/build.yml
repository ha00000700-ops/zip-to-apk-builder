name: Build Web App to APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Direct URL of the ZIP file to build"
        required: true
        type: string
      app_name:
        description: "Application name"
        required: false
        default: "My App"
        type: string
      package_name:
        description: "Android package name"
        required: false
        default: "com.ziptoapk.app"
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download ZIP
        run: |
          mkdir -p input
          curl -L --fail --retry 3 "${{ inputs.zip_url }}" -o input/project.zip
          test -s input/project.zip

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q input/project.zip -d project

          echo "Project contents:"
          find project -maxdepth 3 -type f | head -100

      - name: Detect project root
        shell: bash
        run: |
          ROOT="project"

          if [ ! -f "$ROOT/package.json" ]; then
            FOUND=$(find project -name package.json -type f | head -1 || true)

            if [ -n "$FOUND" ]; then
              ROOT=$(dirname "$FOUND")
            fi
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Using project root: $ROOT"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found."
            exit 1
          fi

      - name: Build web project
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          if npm run | grep -q " build"; then
            npm run build
          else
            echo "No build script found."
            exit 1
          fi

      - name: Prepare Capacitor
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init "$APP_NAME" "$PACKAGE_NAME" --web-dir dist
          fi

          npx cap add android || true
          npx cap sync android

      - name: Build Android APK
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          mkdir -p output

          APK=$(find android -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          cp "$APK" output/app-debug.apk

          echo "APK generated successfully:"
          ls -lh output/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.PROJECT_ROOT }}/output/app-debug.apk
          retention-days: 7
