name: Build Al-Noor APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'al-noor-(النور).zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q 'al-noor-(النور).zip' -d extracted

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ لم يتم العثور على مشروع Android"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "✅ Android project found: $PROJECT_DIR"

      - name: Check Gradle Wrapper
        run: |
          cd "$PROJECT_DIR"

          if [ -f "gradlew" ]; then
            echo "✅ gradlew موجود"
            chmod +x gradlew
          else
            echo "⚠️ gradlew غير موجود، سيتم إنشاء Wrapper"
            gradle wrapper --gradle-version 8.7
            chmod +x gradlew
          fi

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleRelease --stacktrace

      - name: Find APK
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Noor-Release-APK
          path: |
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error
