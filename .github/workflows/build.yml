name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find ZIP
        id: find_zip
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d extracted

          echo "ZIP extracted successfully."

      - name: Find Android Project
        id: android_project
        run: |
          SETTINGS=$(find extracted -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "::error::Android project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Gradle Wrapper
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ]; then
            echo "Gradle Wrapper found."
          else
            gradle wrapper
          fi

          chmod +x ./gradlew
          ./gradlew --version

      - name: Create Debug Signing Key
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore "./debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: apk_path
        run: |
          APK_FILE=$(find extracted -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "::error::APK was not produced."
            find extracted -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK_FILE"

          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.apk_path.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # -----------------------------------------
      # تنظيف تشغيلات GitHub Actions القديمة
      # يحتفظ بآخر 5 تشغيلات فقط
      # -----------------------------------------

      - name: Cleanup Old Workflow Runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking old workflow runs..."

          RUNS=$(gh api \
            --paginate \
            "/repos/${{ github.repository }}/actions/workflows/${{ github.workflow_id }}/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .created_at] | @tsv' \
            | sort -k2 -r)

          COUNT=0

          while IFS=$'\t' read -r RUN_ID CREATED_AT; do
            COUNT=$((COUNT + 1))

            if [ "$COUNT" -le 5 ]; then
              echo "Keeping run: $RUN_ID ($CREATED_AT)"
            else
              echo "Deleting old run: $RUN_ID ($CREATED_AT)"

              gh api \
                --method DELETE \
                "/repos/${{ github.repository }}/actions/runs/$RUN_ID" \
                || echo "Could not delete run $RUN_ID"
            fi
          done <<< "$RUNS"

          echo "Cleanup completed."
